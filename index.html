<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes & Due Reminder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
      padding: 16px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .btn-primary {
      width: 100%;
      margin-top: 14px;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .item {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      border-left: 5px solid #6b7280;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .item.lent {
      border-left-color: #16a34a;
    }

    .item.borrowed {
      border-left-color: #dc2626;
    }

    .item.note {
      border-left-color: #2563eb;
    }

    .item.settled {
      opacity: 0.6;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #e5e7eb;
    }

    .lent .badge {
      background: #dcfce7;
      color: #166534;
    }

    .borrowed .badge {
      background: #fee2e2;
      color: #991b1b;
    }

    .note .badge {
      background: #dbeafe;
      color: #1e40af;
    }

    .meta {
      font-size: 0.8rem;
      color: #4b5563;
      margin-top: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      cursor: pointer;
    }

    .btn-delete {
      color: #b91c1c;
      border-color: #fecaca;
      background: #fef2f2;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal h2 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      color: #b91c1c;
    }

    .reminder-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Notes & Due Reminder</h1>
    <p class="subtitle">Save quotes, notes, and due dates with reminder popups</p>

    <form class="card" id="entryForm">
      <label for="type">Entry Type</label>
      <select id="type">
        <option value="note">Note / Quote</option>
        <option value="lent">To Receive (Money Coming In)</option>
        <option value="borrowed">To Pay (Money Going Out)</option>
      </select>

      <div id="moneyFields" class="hidden">
        <label for="person">Person Name</label>
        <input type="text" id="person" placeholder="e.g. Rahul" />

        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" placeholder="e.g. 500" min="1" />

        <label for="returnDate">Return / Due Date</label>
        <input type="date" id="returnDate" />
      </div>

      <label for="content">Note / Quote / Details</label>
      <textarea id="content" placeholder="Write a quote, note, or extra details..." required></textarea>

      <button type="submit" class="btn-primary">Save Entry</button>
    </form>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="note">Notes / Quotes</button>
      <button class="filter-btn" data-filter="lent">To Receive</button>
      <button class="filter-btn" data-filter="borrowed">To Pay</button>
    </div>

    <div id="listContainer"></div>
  </div>

  <!-- Return Date Popup -->
  <div class="modal-backdrop" id="reminderModal">
    <div class="modal">
      <h2>🔔 Return Date Reminder</h2>
      <div id="reminderList"></div>
      <button class="btn-primary" id="closeModalBtn">Got It</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "notes_due_entries_v1";
    let entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentFilter = "all";

    const typeEl = document.getElementById("type");
    const moneyFieldsEl = document.getElementById("moneyFields");
    const personEl = document.getElementById("person");
    const amountEl = document.getElementById("amount");
    const returnDateEl = document.getElementById("returnDate");
    const contentEl = document.getElementById("content");
    const formEl = document.getElementById("entryForm");
    const listContainerEl = document.getElementById("listContainer");
    const modalEl = document.getElementById("reminderModal");
    const reminderListEl = document.getElementById("reminderList");
    const closeModalBtn = document.getElementById("closeModalBtn");

    function getTodayDateStr() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function saveToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    typeEl.addEventListener("change", () => {
      if (typeEl.value === "note") {
        moneyFieldsEl.classList.add("hidden");
      } else {
        moneyFieldsEl.classList.remove("hidden");
      }
    });

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const type = typeEl.value;
      const content = contentEl.value.trim();
      if (!content) return;

      const entry = {
        id: Date.now(),
        type,
        content,
        person: type !== "note" ? personEl.value.trim() || "Unknown" : "",
        amount: type !== "note" ? Number(amountEl.value) || 0 : 0,
        returnDate: type !== "note" ? returnDateEl.value : "",
        createdAt: getTodayDateStr(),
        settled: false
      };

      entries.unshift(entry);
      saveToStorage();
      renderEntries();
      formEl.reset();
      moneyFieldsEl.classList.add("hidden");
    });

    document.querySelectorAll(".filter-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderEntries();
      });
    });

    function toggleSettled(id) {
      entries = entries.map((item) =>
        item.id === id ? { ...item, settled: !item.settled } : item
      );
      saveToStorage();
      renderEntries();
    }

    function deleteEntry(id) {
      entries = entries.filter((item) => item.id !== id);
      saveToStorage();
      renderEntries();
    }

    function getBadgeText(type) {
      if (type === "lent") return "TO RECEIVE";
      if (type === "borrowed") return "TO PAY";
      return "NOTE / QUOTE";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function renderEntries() {
      const filtered = entries.filter((item) =>
        currentFilter === "all" ? true : item.type === currentFilter
      );

      if (filtered.length === 0) {
        listContainerEl.innerHTML = `<div class="empty">No entries yet. Add one above!</div>`;
        return;
      }

      listContainerEl.innerHTML = filtered
        .map((item) => {
          const moneyInfo =
            item.type !== "note"
              ? `<div class="meta"><strong>Person:</strong> ${escapeHtml(item.person)} | <strong>Amount:</strong> ₹${item.amount} | <strong>Due Date:</strong> ${item.returnDate || "Not set"}</div>`
              : "";

          const settleBtn =
            item.type !== "note"
              ? `<button class="btn-sm" onclick="toggleSettled(${item.id})">${item.settled ? "Mark Pending" : "Mark Settled"}</button>`
              : "";

          return `
            <div class="item ${item.type} ${item.settled ? "settled" : ""}">
              <div class="item-top">
                <span class="badge">${getBadgeText(item.type)}</span>
                <span class="meta">Added: ${item.createdAt}</span>
              </div>
              <div>${escapeHtml(item.content)}</div>
              ${moneyInfo}
              <div class="actions">
                ${settleBtn}
                <button class="btn-sm btn-delete" onclick="deleteEntry(${item.id})">Delete</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function checkDueReminders() {
      const today = getTodayDateStr();
      const dueItems = entries.filter(
        (item) =>
          item.type !== "note" &&
          !item.settled &&
          item.returnDate &&
          item.returnDate <= today
      );

      if (dueItems.length > 0) {
        reminderListEl.innerHTML = dueItems
          .map((item) => {
            const actionText =
              item.type === "lent"
                ? `Collect <strong>₹${item.amount}</strong> from <strong>${escapeHtml(item.person)}</strong>`
                : `Pay <strong>₹${item.amount}</strong> to <strong>${escapeHtml(item.person)}</strong>`;

            const statusText =
              item.returnDate === today
                ? "Due today!"
                : `Overdue since ${item.returnDate}`;

            return `
              <div class="reminder-box">
                <div>${actionText}</div>
                <div class="meta">${statusText} — ${escapeHtml(item.content)}</div>
              </div>
            `;
          })
          .join("");

        modalEl.classList.add("show");
      }
    }

    closeModalBtn.addEventListener("click", () => {
      modalEl.classList.remove("show");
    });

    renderEntries();
    checkDueReminders();
  </script>
</body>
</html>
